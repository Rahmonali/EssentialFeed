name: CI-macOS

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: xcode-27

    timeout-minutes: 8

    steps:
    - uses: actions/checkout@v4

    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode_27.app

    - name: Xcode version
      run: /usr/bin/xcodebuild -version

    - name: Build and Test
      run: |
        xcodebuild clean build test \
          -project EssentialFeed/EssentialFeed.xcodeproj \
          -scheme CI_macOS \
          -sdk macosx \
          -destination 'platform=macOS,arch=arm64' \
          -enableThreadSanitizer YES \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          ONLY_ACTIVE_ARCH=YES
